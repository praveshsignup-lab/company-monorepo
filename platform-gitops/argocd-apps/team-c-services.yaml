apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: team-c-services
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - env: dev
          - env: staging
          - env: prod
  template:
    metadata:
      name: "service-c-{{ .env }}"
      labels:
        team: team-c
        env: "{{ .env }}"
    spec:
      project: team-c
      source:
        repoURL: https://github.com/praveshsignup-lab/company-monorepo.git
        targetRevision: main
        path: "platform-gitops/applications/service-c/overlays/{{ .env }}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "team-c-{{ .env }}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - SkipDryRunOnMissingResource=true
        retry:
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
