# Chaos generator. Off-by-default in real clusters; enabled in this demo
# so MWMBR alerts fire end-to-end. Toggle by scaling the deployment:
#   kubectl -n chaos scale deploy/budget-burner --replicas=0
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: chaos
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"  # after everything else is up
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://github.com/praveshsignup-lab/company-monorepo.git
    targetRevision: main
    path: platform-gitops/chaos
  destination:
    server: https://kubernetes.default.svc
    namespace: chaos
  syncPolicy:
    automated:
      prune: true
      selfHeal: false   # don't auto-revive a manual scale-to-0
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
