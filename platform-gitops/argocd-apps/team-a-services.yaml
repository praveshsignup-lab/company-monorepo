# Team A → service-a deployed to dev/staging/prod.
# Multi-source Application: chart from service repo, env values from gitops repo.
#
#   App behavior change (new endpoint) -> PR to praveshsignup-lab/service-a
#   Runtime change (replicas, mem)     -> PR to platform-gitops/services/service-a/<env>/values.yaml
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: team-a-services
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - { env: dev,     chartRevision: main }
          - { env: staging, chartRevision: main }
          - { env: prod,    chartRevision: main }   # pin to a tag in real prod
  template:
    metadata:
      name: "service-a-{{ .env }}"
      labels:
        team: team-a
        env: "{{ .env }}"
    spec:
      project: team-a
      sources:
        # 1) Chart from the service repo — single source of truth for app behaviour.
        - repoURL: git@github-pravesh:praveshsignup-lab/service-a.git
          targetRevision: "{{ .chartRevision }}"
          path: chart
          helm:
            releaseName: "service-a"
            valueFiles:
              - "$gitops/platform-gitops/services/service-a/{{ .env }}/values.yaml"
        # 2) Env values from this gitops repo, addressed via $gitops alias.
        - repoURL: https://github.com/praveshsignup-lab/company-monorepo.git
          targetRevision: main
          ref: gitops
      destination:
        server: https://kubernetes.default.svc
        namespace: "team-a-{{ .env }}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - SkipDryRunOnMissingResource=true
        retry:
          limit: 5
          backoff: { duration: 10s, factor: 2, maxDuration: 3m }
