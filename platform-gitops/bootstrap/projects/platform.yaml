# Platform AppProject — owned by platform-sre.
# Used by root app-of-apps and observability stack.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Platform-owned infrastructure (ArgoCD, observability, ingress, cert-manager)
  sourceRepos:
    - https://github.com/praveshsignup-lab/company-monorepo.git
    # Upstream charts / manifests used by platform components:
    - https://prometheus-community.github.io/helm-charts
    - https://grafana.github.io/helm-charts
    - https://kubernetes.github.io/ingress-nginx
    - https://charts.jetstack.io
    - https://raw.githubusercontent.com/argoproj/argo-cd/*
  destinations:
    - namespace: argocd
      server: https://kubernetes.default.svc
    - namespace: sidekick-monitoring
      server: https://kubernetes.default.svc
    - namespace: observability
      server: https://kubernetes.default.svc
    - namespace: ingress-nginx
      server: https://kubernetes.default.svc
    - namespace: cert-manager
      server: https://kubernetes.default.svc
    - namespace: kube-system
      server: https://kubernetes.default.svc
    - namespace: chaos
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
  roles:
    - name: admin
      description: Full control over platform project
      policies:
        - p, proj:platform:admin, applications, *, platform/*, allow
        - p, proj:platform:admin, repositories, *, *, allow
      groups:
        - platform-admin
    - name: read
      description: Read-only access
      policies:
        - p, proj:platform:read, applications, get, platform/*, allow
      groups:
        - all-engineers
