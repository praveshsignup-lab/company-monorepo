# Org-specific RBAC extensions on top of upstream ArgoCD.
# The argocd-rbac-cm ConfigMap (policy.csv) is patched INLINE in kustomization.yaml
# because it must be a strategic-merge patch on the upstream ConfigMap, not a new resource.
#
# This file contains *new* resources only:
#   * Role + RoleBinding allowing Prometheus to scrape argocd-server metrics
#   * ServiceMonitor for argocd-server
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus-metrics-reader
  namespace: argocd
rules:
  - apiGroups: [""]
    resources: ["services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus-metrics-reader
  namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus-metrics-reader
subjects:
  - kind: ServiceAccount
    name: kube-prometheus-stack-prometheus
    namespace: sidekick-monitoring
---
# ServiceMonitor for argocd-server metrics (requires Prometheus Operator CRDs).
# Comment out the whole block below if kube-prometheus-stack isn't installed yet.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: argocd-server
  namespace: argocd
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: argocd-server
  endpoints:
    - port: metrics
      interval: 30s
      path: /metrics
