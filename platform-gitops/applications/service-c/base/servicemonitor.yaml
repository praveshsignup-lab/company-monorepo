# Scraped by the platform Prometheus (selectors are cluster-wide).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: service-c
  labels:
    # Must match kube-prometheus-stack's release label so it picks us up.
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: service-c
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      relabelings:
        - action: replace
          sourceLabels: [__meta_kubernetes_namespace]
          targetLabel: namespace
        # Stamp job=service-c so SLO query labels are predictable.
        - action: replace
          targetLabel: job
          replacement: service-c
