# Team A owns this SLO. Sloth turns it into MWMBR recording + alerting rules.
apiVersion: sloth.slok.dev/v1
kind: PrometheusServiceLevel
metadata:
  name: service-c
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  service: "service-c"
  labels:
    team: "team-c"
    tier: "demo"
  slos:
    - name: "availability"
      objective: 99.5
      description: "99.5% of HTTP requests over 30 days return non-5xx."
      sli:
        events:
          errorQuery: |
            sum(rate(http_requests_total{job="service-c",code=~"5.."}[{{.window}}]))
          totalQuery: |
            sum(rate(http_requests_total{job="service-c"}[{{.window}}]))
      alerting:
        name: ServiceCAvailability
        labels:
          category: availability
          team: team-c
        annotations:
          summary: "service-c availability SLO burn"
          runbook_url: "https://runbooks.example/team-c/service-c/availability"
        pageAlert:
          labels:
            severity: page
        ticketAlert:
          labels:
            severity: ticket
