# Chaos: budget-burner. Continuously calls /err on service-a in team-a-prod
# so http_requests_total{code="500"} climbs, the SLO's 5m + 1h error ratio
# spikes, and Sloth's MWMBR PageAlert fires end-to-end into Slack via the
# platform AlertmanagerConfig.
#
# Tuning: 1 req/s = 5% steady error rate at 20 rps baseline. Sloth's 0.995
# objective + 14.4× page burn over 1h means even a low constant error rate
# will trigger the ticket alert; setting REQS_PER_SEC=20 here saturates.
#
# Live toggle: scale to 0 to stop the burn ->
#   kubectl -n chaos scale deploy/budget-burner --replicas=0
apiVersion: apps/v1
kind: Deployment
metadata:
  name: budget-burner
  namespace: chaos
  labels:
    app.kubernetes.io/name: budget-burner
    app.kubernetes.io/part-of: sre-chaos
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: budget-burner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: budget-burner
    spec:
      restartPolicy: Always
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: burner
          image: curlimages/curl:8.10.1
          imagePullPolicy: IfNotPresent
          env:
            - name: TARGET
              value: "http://service-a.team-a-prod.svc.cluster.local"
            - name: OK_RPS
              value: "10"           # baseline good traffic
            - name: ERR_PERIOD_SEC
              value: "45"           # one /err every 45s (pod crashes,
                                    # restarts in ~10-20s, SLI dips ~3-5%)
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              OK_SLEEP=$(awk "BEGIN{printf \"%.3f\", 1/${OK_RPS}}")
              echo "burning: ${OK_RPS} rps OK + 1 /err per ${ERR_PERIOD_SEC}s -> ${TARGET}"
              (
                while true; do
                  sleep "${ERR_PERIOD_SEC}"
                  curl -fsS -o /dev/null -m 2 "${TARGET}/err" || true
                done
              ) &
              while true; do
                curl -fsS -o /dev/null -m 2 "${TARGET}/" || true
                sleep "${OK_SLEEP}"
              done
          resources:
            requests: { cpu: 20m, memory: 16Mi }
            limits:   { cpu: 100m, memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
