# Alertmanager Slack message templates loaded via kube-prometheus-stack's
# alertmanager.templateFiles values key. They render every page consistently
# and surface the required runbook_url annotation; pages without a runbook
# are made obvious in chat so they can be fixed at the source.
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-templates
  namespace: sidekick-monitoring
data:
  slack.platform.tmpl: |
    {{ define "slack.platform.title" -}}
    [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }}
    {{- if .CommonLabels.sloth_service }} — {{ .CommonLabels.sloth_service }}/{{ .CommonLabels.sloth_slo }}{{ end }}
    {{- end }}

    {{ define "slack.platform.text" -}}
    {{ range .Alerts -}}
    *Severity:* `{{ .Labels.severity }}`  *Team:* `{{ .Labels.team }}`
    *Summary:* {{ .Annotations.summary }}
    {{ if .Annotations.description }}*Detail:* {{ .Annotations.description }}{{ end }}
    {{ if .Annotations.runbook_url -}}
    *Runbook:* {{ .Annotations.runbook_url }}
    {{- else -}}
    :warning: *No runbook_url set — fix this alert's annotations (SRE Contract §5).*
    {{- end }}
    *Dashboards:*
      • <https://grafana/d/slo-overview?var-service={{ .Labels.sloth_service }}|SLO Overview>
      • <https://grafana/d/slo-registry|SLO Registry>
    ---
    {{ end -}}
    {{- end }}
